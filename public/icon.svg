<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#080b11" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="bull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#bg)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#1e293b" stroke-width="6" />
  <!-- Candlestick bars -->
  <line x1="142" y1="150" x2="142" y2="365" stroke="#10b981" stroke-width="12" stroke-linecap="round" />
  <rect x="118" y="210" width="48" height="110" rx="10" fill="url(#bull)" />

  <line x1="256" y1="120" x2="256" y2="390" stroke="#ef4444" stroke-width="12" stroke-linecap="round" />
  <rect x="232" y="170" width="48" height="145" rx="10" fill="url(#accent)" />

  <line x1="370" y1="100" x2="370" y2="330" stroke="#10b981" stroke-width="12" stroke-linecap="round" />
  <rect x="346" y="135" width="48" height="135" rx="10" fill="url(#bull)" />

  <!-- Bottom trend arc -->
  <path d="M96 368 Q220 340 395 160" fill="none" stroke="#3b82f6" stroke-width="10" stroke-linecap="round" opacity="0.85" />
  <circle cx="395" cy="160" r="14" fill="#3b82f6" />
</svg>
